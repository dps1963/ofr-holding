<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Supporting BMSG</title>
<meta name="description" content="OurFamilyRocks.com and BringMeSunshineGroup.com are not taking support payments at the moment.">
<link rel="icon" href="brand/assets/favicon-32.png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{--wm:#272B30;--accent:#0F7362;--soft:#5C6470;--ink:#272B30}
  *{box-sizing:border-box;margin:0}
  body{font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:#FAFBFC;line-height:1.65;min-height:100vh;
       display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 22px 36px}
  main{max-width:560px;display:flex;flex-direction:column;align-items:center;gap:16px;margin:auto 0}
  .wordmark{font-weight:800;font-size:1.7rem;color:var(--wm);margin-top:30px;text-decoration:none}
  .kind-tag{font-family:'Caveat',cursive;font-size:1.3rem;font-weight:500;color:var(--accent)}
  h1{font-size:clamp(1.6rem,5.5vw,2.2rem);color:var(--wm);text-wrap:balance;}
  p{color:var(--soft);max-width:46ch}
  footer{margin-top:34px;color:var(--soft);font-size:.85rem}
  footer a{color:var(--accent);text-decoration:none;font-weight:600}
</style>
</head>
<body>
<main>
  <a class="wordmark" href="index.html">Our Family <span style="color:var(--accent)">Rocks</span></a>
  <span id="kindTag" class="kind-tag">always be kind</span>
  <h1>Supporting BMSG</h1>
  <p>We're not taking support payments at the moment. Thank you for wanting to help — the best support right now is using the apps and telling a friend.</p>
</main>
<footer>© 2026 OurFamilyRocks.com · a member of <a href="https://bringmesunshinegroup.com">BringMeSunshineGroup.com</a><nav aria-label="BMSG legal documents" class="bmsg-legal-links"><a href="https://bringmesunshinegroup.com/privacy.html">Privacy</a> · <a href="https://bringmesunshinegroup.com/terms.html">Terms &amp; Conditions</a></nav></footer>
<script>
(function(){
  var K={en:"always be kind",mi:"kia atawhai tonu",fr:"soyez toujours bienveillant",es:"sé siempre amable",de:"sei immer freundlich",it:"sii sempre gentile",pt:"seja sempre gentil",nl:"wees altijd vriendelijk",sv:"var alltid snäll",nb:"vær alltid snill",no:"vær alltid snill",da:"vær altid venlig",fi:"ole aina ystävällinen",pl:"bądź zawsze życzliwy",cs:"buď vždy laskavý",ro:"fii mereu bun",hu:"légy mindig kedves",el:"να είσαι πάντα ευγενικός",tr:"her zaman nazik ol",ru:"всегда будь добрым",uk:"завжди будь добрим",ar:"كن لطيفًا دائمًا",he:"היו תמיד אדיבים",hi:"हमेशा दयालु बनें",th:"มีเมตตาเสมอ",vi:"luôn tử tế",id:"selalu berbaik hati",ms:"sentiasa berbaik hati",fil:"laging maging mabait",tl:"laging maging mabait",ja:"いつも親切に",ko:"항상 친절하게",zh:"常怀善意",zhh:"常懷善意",sm:"ia agalelei pea"};
  var RTL={ar:1,he:1};
  function pick(langs){for(var i=0;i<langs.length;i++){var l=String(langs[i]).toLowerCase();if(l.indexOf("zh")===0){return {t:(/tw|hk|mo|hant/.test(l)?K.zhh:K.zh),l:l,r:0};}var p=l.split("-")[0];if(K[p])return {t:K[p],l:p,r:RTL[p]||0};}return {t:K.en,l:"en",r:0};}
  var el=document.getElementById("kindTag"); if(!el) return;
  var m=pick(navigator.languages||[navigator.language||"en"]);
  el.textContent=m.t; el.setAttribute("lang",m.l); el.setAttribute("dir",m.r?"rtl":"ltr");
})();
</script>
<script src="site-layout.js" defer></script></body>
</html>
